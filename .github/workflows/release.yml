name: Release Draft

on:
  push:
    tags:
      - "v*"
      - "beta-v*"

permissions:
  contents: read

concurrency:
  group: quosparr-release
  cancel-in-progress: false

jobs:
  release-notes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Generate release notes
        uses: orhun/git-cliff-action@v4
        id: cliff
        with:
          config: cliff.toml
          args: --latest --strip header
        env:
          GITHUB_TOKEN: ${{ github.token }}
      - name: Write release notes
        env:
          RELEASE_NOTES: ${{ steps.cliff.outputs.content }}
        run: |
          printf '%s\n' "$RELEASE_NOTES" > release-notes.md
          # The in-app update window shows only the changelog, not install hints
          cp release-notes.md update-notes.md
          if ! grep -q '[^[:space:]]' release-notes.md; then
            printf 'Builds for macOS, Windows and Linux.\n' > release-notes.md
          fi
          # Per-OS download links are appended in v1-release from the final assets
      - uses: actions/upload-artifact@v7
        with:
          name: release-notes
          path: |
            release-notes.md
            update-notes.md

  v1-preflight:
    runs-on: macos-latest
    outputs:
      channel: ${{ steps.version.outputs.channel }}
    steps:
      - uses: actions/checkout@v7
      - name: Validate version and required signing secrets
        id: version
        env:
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          MYGO_UPDATE_PRIVATE_KEY: ${{ secrets.MYGO_UPDATE_PRIVATE_KEY }}
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          python3 - <<'PY'
          import json, os, re
          config = json.load(open('mygo.json'))
          version, tag = config['version'], os.environ['GITHUB_REF_NAME']
          base = r'(0|[1-9]\d*)\.(0|[1-9]\d*)\.(0|[1-9]\d*)'
          identifier = r'(?:0|[1-9]\d*|[0-9]*[A-Za-z-][0-9A-Za-z-]*)'
          stable = re.fullmatch(base, version)
          beta = re.fullmatch(base + '-' + identifier + r'(?:\.' + identifier + ')*', version)
          if stable and tag == 'v' + version:
              channel = 'stable'
          elif beta and tag == 'beta-v' + version:
              channel = 'beta'
          else:
              raise SystemExit('release tag must match the stable or beta version in mygo.json')
          for key in ('SPARKLE_PUBLIC_KEY', 'SPARKLE_PRIVATE_KEY', 'MYGO_UPDATE_PRIVATE_KEY',
                      'MACOS_CERTIFICATE_P12', 'MACOS_CERTIFICATE_PASSWORD',
                      'APPLE_API_KEY_P8', 'APPLE_API_KEY_ID', 'APPLE_API_ISSUER_ID'):
              if not os.environ.get(key, '').strip():
                  raise SystemExit('Missing ' + key + ' secret')
          if os.environ['SPARKLE_PUBLIC_KEY'].strip() != config['macos']['infoPlist']['SUPublicEDKey']:
              raise SystemExit('SPARKLE_PUBLIC_KEY must match SUPublicEDKey')
          with open(os.environ['GITHUB_OUTPUT'], 'a') as output:
              output.write('channel=' + channel + '\n')
          PY
      - name: Check all published Sparkle build numbers
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 Scripts/check-v1-build-number.py --config mygo.json

  # The tagged commit's CI run already covers vet, race, native Windows/Linux
  # tests and six-target builds; running them again here only doubled the
  # chance of a timing flake blocking the release. Re-run failed CI jobs, then
  # re-run this workflow.
  ci-gate:
    needs: v1-preflight
    runs-on: ubuntu-latest
    timeout-minutes: 120
    permissions:
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 50
      - name: Wait for CI on the tagged commit
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # CI skips website-only pushes, so the tagged commit may have no run:
          # walk back over website-only commits to the one CI last covered
          chain=("$GITHUB_SHA")
          while [[ ${#chain[@]} -lt 50 ]]; do
            sha="${chain[${#chain[@]}-1]}"
            git diff --name-only "$sha^" "$sha" 2>/dev/null | grep -qvE '^(website/|\.github/workflows/website\.yml$)' && break
            parent="$(git rev-parse --verify --quiet "$sha^")" || break
            chain+=("$parent")
          done
          for attempt in $(seq 1 220); do
            for sha in "${chain[@]}"; do
              runs="$(gh api "repos/$GITHUB_REPOSITORY/actions/workflows/ci.yml/runs?head_sha=$sha&event=push" --jq '[.workflow_runs[] | {status, conclusion, html_url}]')"
              jq -e 'length > 0' <<<"$runs" >/dev/null && break
            done
            if jq -e 'any(.[]; .conclusion == "success")' <<<"$runs" >/dev/null; then
              echo "CI passed for $sha"
              exit 0
            fi
            if jq -e 'length > 0 and all(.[]; .status == "completed")' <<<"$runs" >/dev/null; then
              jq -r '.[] | "CI \(.conclusion): \(.html_url)"' <<<"$runs"
              echo "::error::CI did not pass for $sha; re-run its failed jobs, then re-run this workflow"
              exit 1
            fi
            if [[ "$attempt" -ge 20 ]] && jq -e 'length == 0' <<<"$runs" >/dev/null; then
              echo "::error::No CI push run for $GITHUB_SHA or the commit before its website-only changes; push the commit to main before tagging"
              exit 1
            fi
            sleep 30
          done
          echo "::error::Timed out waiting for CI on $GITHUB_SHA"
          exit 1

  v1-macos:
    needs: [v1-preflight, ci-gate]
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v7
      # Same runner and builds as CI's go-package-macos, whose cache for this
      # commit already exists by the time ci-gate passes
      - uses: ./.github/actions/setup-go
        with:
          cache-job: go-package-macos
      - name: Import Developer ID certificate and notary API key
        env:
          MACOS_CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          MACOS_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: bash Scripts/import-macos-signing.sh >> "$GITHUB_ENV"
      - name: Package, sign and notarize final apps and Sparkle feeds
        env:
          V1_UPDATE_CHANNEL: ${{ needs.v1-preflight.outputs.channel }}
          SPARKLE_PUBLIC_KEY: ${{ secrets.SPARKLE_PUBLIC_KEY }}
          SPARKLE_PRIVATE_KEY: ${{ secrets.SPARKLE_PRIVATE_KEY }}
          MYGO_UPDATE_PRIVATE_KEY: ${{ secrets.MYGO_UPDATE_PRIVATE_KEY }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          # Keep one macos-26 runner: concurrent hosted runners previously failed acquisition
          mkdir -p dist-v1
          for arch in arm64 x86_64; do
            export V1_BUILD_DIR="$RUNNER_TEMP/v1-release-$arch"
            ARCH="$arch" V1_DEVELOPMENT_PACKAGE=0 bash Scripts/package-v1-app.sh
            cp "$V1_BUILD_DIR"/*.zip "$V1_BUILD_DIR"/*.dmg "$V1_BUILD_DIR"/*.tar.gz "$V1_BUILD_DIR"/update-*.json dist-v1/
          done
          bash Scripts/legacy-appcast.sh "$PWD/dist-v1" "$V1_BUILD_DIR/config/mygo.json" "$GITHUB_REF_NAME"
      - uses: actions/upload-artifact@v7
        with:
          name: v1-macos
          path: dist-v1/*
          if-no-files-found: error

  v1-platforms:
    needs: [v1-preflight, ci-gate]
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows
          - os: ubuntu-latest
            platform: linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      # windows-latest and ubuntu-latest are also go-native-tests runners
      - uses: ./.github/actions/setup-go
        with:
          cache-job: go-native-tests
      - uses: actions/setup-python@v6
        if: runner.os == 'Windows'
        with:
          python-version: "3.13"
      # Windows installers use the NSIS 3.13 zip that mygo build downloads
      # and checks. Do not preinstall it with Chocolatey: its community
      # feed returns 503 often enough to fail the job before packaging.
      # Runtime packages only, as in CI: mygo loads GTK by versioned soname
      - name: Install Linux desktop runtime dependencies
        if: runner.os == 'Linux'
        timeout-minutes: 5
        run: |
          sudo apt-get -o Acquire::Retries=3 update
          sudo apt-get -o Acquire::Retries=3 install -y libgtk-3-0t64 libayatana-appindicator3-1 fonts-noto-cjk
      - name: Package both architectures
        shell: bash
        env:
          V1_UPDATE_CHANNEL: ${{ needs.v1-preflight.outputs.channel }}
          MYGO_UPDATE_PRIVATE_KEY: ${{ secrets.MYGO_UPDATE_PRIVATE_KEY }}
          PLATFORM: ${{ matrix.platform }}
        run: |
          # The Windows runner exposes Python as python; the scripts use python3
          if [[ "$RUNNER_OS" == Windows ]]; then
            python3() { python "$@"; }
            export -f python3
          fi
          mkdir -p dist-v1
          for arch in amd64 arm64; do
            export V1_BUILD_DIR="$PWD/build/v1-release-$PLATFORM-$arch"
            bash Scripts/package-v1-platform.sh "$PLATFORM/$arch"
            stage="$V1_BUILD_DIR/$PLATFORM-$arch"
            cp "$stage"/*.tar.gz "$stage"/update-*.json dist-v1/
            if [[ "$PLATFORM" == windows ]]; then
              # Publish mygo's quosparr-setup-<version>-<arch>.exe under the
              # established Quosparr.Setup.<version>.<arch>.exe asset name
              for installer in "$stage"/quosparr-setup-*-"$arch".exe; do
                version="${installer##*/quosparr-setup-}"
                version="${version%-"$arch".exe}"
                cp "$installer" "dist-v1/Quosparr.Setup.$version.$arch.exe"
              done
            else
              cp "$stage"/*.deb dist-v1/
            fi
          done
          if [[ "$PLATFORM" == linux ]]; then
            cmp build/v1-release-linux-amd64/linux-amd64/install.sh build/v1-release-linux-arm64/linux-arm64/install.sh
            cp build/v1-release-linux-amd64/linux-amd64/install.sh dist-v1/install.sh
          fi
      - name: Verify native Windows installation and bundled SQLite
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./Scripts/verify-v1-windows-native.ps1 -Stage "build/v1-release-windows-amd64/windows-amd64" -Arch amd64
      - name: Verify native Linux package and bundled SQLite
        if: runner.os == 'Linux'
        run: bash Scripts/verify-v1-linux-native.sh "build/v1-release-linux-amd64/linux-amd64" amd64
      - uses: actions/upload-artifact@v7
        with:
          name: v1-${{ matrix.platform }}
          path: dist-v1/*
          if-no-files-found: error

  v1-release:
    name: Create v1 release draft
    needs: [v1-preflight, v1-macos, v1-platforms, release-notes]
    runs-on: macos-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
      - uses: actions/download-artifact@v8
        with:
          pattern: v1-*
          path: dist-v1
          merge-multiple: true
      - uses: actions/download-artifact@v8
        with:
          name: release-notes
          path: .
      - name: Verify every final release asset
        env:
          V1_UPDATE_CHANNEL: ${{ needs.v1-preflight.outputs.channel }}
          V1_RELEASE_TAG: ${{ github.ref_name }}
        run: |
          brew install sevenzip
          mkdir -p "$RUNNER_TEMP/v1-tools"
          ln -s "$(command -v 7zz)" "$RUNNER_TEMP/v1-tools/7z"
          export PATH="$RUNNER_TEMP/v1-tools:$PATH"
          python3 Scripts/stage-v1-config.py "$PWD" "$RUNNER_TEMP/v1-release-config"
          go run ./Scripts/release-assets notes -config "$RUNNER_TEMP/v1-release-config/mygo.json" -dir dist-v1 -notes update-notes.md
          python3 Scripts/release-checksums.py write dist-v1
          bash Scripts/verify-v1-release.sh "$PWD/dist-v1" "$RUNNER_TEMP/v1-release-config/mygo.json"
      - name: Append per-OS download links to release notes
        run: bash Scripts/release-download-notes.sh dist-v1 "$GITHUB_REF_NAME" "$GITHUB_REPOSITORY" >> release-notes.md
      # Distribution preparation is paused together with public publication
      # - name: Prepare Homebrew Cask
      #   if: needs.v1-preflight.outputs.channel == 'stable'
      #   run: python3 Scripts/generate-v1-homebrew.py dist-v1 mygo.json dist-v1/quosparr.rb

      - name: Create validated stable or Beta draft
        env:
          GH_TOKEN: ${{ github.token }}
          V1_UPDATE_CHANNEL: ${{ needs.v1-preflight.outputs.channel }}
        run: |
          tag="$GITHUB_REF_NAME"
          if [[ "$V1_UPDATE_CHANNEL" == stable ]]; then
            gh release create "$tag" dist-v1/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --latest=false --title "$tag" --notes-file release-notes.md
          else
            gh release create "$tag" dist-v1/* --repo "$GITHUB_REPOSITORY" --verify-tag --draft --prerelease --latest=false --title "$tag" --notes-file release-notes.md
          fi

      # Every asset is verified above, so a stable tag goes public as latest
      - name: Publish stable release and promote latest
        if: needs.v1-preflight.outputs.channel == 'stable'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release edit "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" --draft=false --latest=true

      # The shared Beta feed stays paused; Beta tags remain prerelease drafts
